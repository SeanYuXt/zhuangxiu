<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>湖畔 · 整屋效果</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f1ea;color:#393c35;font:15px system-ui}header{display:flex;align-items:center;justify-content:space-between;padding:24px 5vw}h1{font-size:25px;font-weight:500;margin:0}a{color:inherit;text-decoration:none}nav a{padding:10px 15px;background:white;border-radius:24px}main{max-width:1440px;margin:auto;padding:0 4vw 50px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:25px}figure{margin:0;background:#e8e6df;border-radius:14px;overflow:hidden}figure img{display:block;width:100%;cursor:zoom-in}figcaption{padding:15px 20px;background:#fffaf3}.wide{grid-column:1/-1}p{color:#7a7c73;font-size:13px;margin:7px 0 22px}dialog{border:0;padding:0;background:#151713;max-width:96vw;max-height:96vh}dialog img{display:block;max-width:95vw;max-height:90vh}dialog button{position:absolute;right:12px;top:12px;border:0;border-radius:50%;padding:10px 14px;cursor:pointer}dialog::backdrop{background:#000b}@media(max-width:700px){.grid{grid-template-columns:1fr;gap:16px}header{padding:22px 4vw}h1{font-size:20px}}</style><header><h1>湖畔 · 整屋效果</h1><nav><a href="child-floating-study.html?view=study">儿童房单独试排</a> <a href="column-view.html?space=master">进入全屋漫游 →</a></nav></header><main><p>已并入确认的主卫与弧形梳妆柜 · 当前全屋模型直接取景</p><div class="grid" id="gallery"></div></main><dialog><button aria-label="关闭">×</button><img alt="放大效果"></dialog><script>const shots=[['whole','全屋布局','wide'],['living','客厅',''],['dining','餐厅与湖景',''],['master','主卧',''],['wardrobe','床尾收纳',''],['dressing','弧形梳妆区',''],['bath2','主卫 · 保留原门的开放布局',''],['bed1','老人房',''],['bed3','儿童房 · 原门与窗边学习位','']];const d=document.querySelector('dialog');for(const [id,title,cls]of shots){const f=document.createElement('figure');f.className=cls;const img=new Image();img.src='offline-render/accepted-94-'+id+'.png';img.alt=title;img.loading='lazy';img.onclick=()=>{d.querySelector('img').src=img.src;d.showModal()};const c=document.createElement('figcaption');c.textContent=title;f.append(img,c);gallery.append(f)}d.querySelector('button').onclick=()=>d.close();d.onclick=e=>{if(e.target===d)d.close()};</script></html>
