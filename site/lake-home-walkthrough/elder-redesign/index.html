<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elder room</title><style>
:root{font:15px/1.7 system-ui,-apple-system,'PingFang SC',sans-serif;color:#373731;background:#f4f1ea}*{box-sizing:border-box}body{margin:0}header{padding:22px 28px;border-bottom:1px solid #ddd8cd;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font:28px/1.3 Georgia,'Songti SC',serif;margin:0 0 6px}h2{font-size:17px;margin:0 0 12px}p{margin:10px 0}small,.muted{color:#78786c;font-size:12px}button{font:inherit;cursor:pointer;border:1px solid #d7d4c7;background:#fbfaf6;color:inherit;border-radius:9px;padding:9px 13px}button.active{background:#5c6255;color:#fff;border-color:#5c6255}nav{display:flex;gap:5px}nav button{white-space:nowrap}main{display:grid;grid-template-columns:252px minmax(380px,1fr) 270px;gap:14px;padding:18px;max-width:1700px;margin:auto}aside,.stage{background:#fbfaf6;border:1px solid #ddd8cd;border-radius:18px;padding:20px}aside button{display:block;text-align:left;width:100%;margin:9px 0}.stage{padding:12px;min-height:680px;position:relative;background:#e9e5dc;overflow:hidden}#plan{width:100%;height:640px;display:block}#model{width:100%;height:640px;display:none}label{display:block;margin:16px 0}input{accent-color:#5c6255}hr{border:0;border-top:1px solid #ddd8cd;margin:20px 0}.tag{font-size:12px;color:#5c6255;letter-spacing:1px}.metric{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #e7e3da}.metric strong{font-weight:600;white-space:nowrap}.warning{padding:12px;background:#f0e6d7;color:#805b34;border-radius:8px;font-size:13px}.note{font-size:13px;padding:10px 5px}.swatches{display:flex;gap:10px;margin-top:10px}.swatches i{display:block;width:35px;height:35px;border-radius:50%;border:1px solid #d4cdbf}.legend{font-size:12px;color:#6c7063}.result{font-size:13px;background:#e6e9df;padding:11px;border-radius:8px}a{color:#5c6255}#busy{position:absolute;left:20px;top:15px;font-size:13px}.hidden{display:none!important}@media(max-width:1000px){main{grid-template-columns:220px minmax(350px,1f
