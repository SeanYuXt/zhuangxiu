<header><div><small>MASTER SUITE</small><h1>主卧套间 · 空间体验</h1><p>收纳与洗浴设计</p></div><nav aria-label="视角与工具"><a href="accepted-effects.html" style="padding:10px;color:inherit;text-decoration:none">整屋效果图</a><a href="column-view.html?space=master&angle=master-dressing" style="padding:10px;color:inherit;text-decoration:none">全屋设计</a><button data-pov="entry">主卫</button><button data-view="bathTop">俯视</button><button data-pov="dressing">化妆柜</button><button data-view="whole">套间</button><button id="settings-toggle" aria-expanded="false" aria-controls="settings-panel">更多</button><button id="info-toggle" aria-expanded="false" aria-controls="info-panel">设计说明</button><button id="fullscreen-toggle">全屏</button></nav></header>
<main><aside class="locations" id="settings-panel" hidden><button class="panel-close" data-close="settings-panel" aria-label="关闭更多设置">×</button><h2>空间定位</h2><button data-view="footwall">床尾上下分段柜门</button><button data-view="corner">卧室入口内凹弧面</button><button data-view="vanity">侧边梳妆台</button><button data-view="entry">整面化妆柜</button><button data-view="window">窗上挂机候选位置</button><button data-view="room">卧室与窗户关系</button><button data-view="bed">床头半墙</button><button data-view="bath">主卫室内</button><button data-view="whole">查看全部</button>
<button data-view="storage">连续衣柜内部 · 保险箱</button><h2>效果内标注</h2><label><input id="detail-toggle" type="checkbox"> 灯／开关／圆角／分区就地标注</label><h2>使用状态</h2><label><input id="chair-pull" type="checkbox"> 拉出妆凳／显示坐姿包络</label><label><input id="vanity-drawers" type="checkbox"> 梳妆台两个浅抽拉出</label><label>床尾柜<select id="foot-mode"><option value="closed">柜门关闭</option><option value="open">平开门90°</option><option value="upper">仅打开上排被褥柜门</option><option value="drawers">两组共四只外抽拉出</option><option value="inside">内部剖视（不是开门状态）</option></select></label><label><input id="entry-open" type="checkbox"> 连续衣柜内部剖视（非开门状态）</label><label hidden><input id="entry-drawers" type="checkbox"> 综合柜三层外抽拉出</label>
<label hidden><input id="tray-pull" type="checkbox"> 衣帽柜95cm高理物板拉出</label><label><input id="bath-mirror-inside" type="checkbox"> 主卫镜柜内部剖视（非开门）</label><label><input id="bath-curtain" type="checkbox"> 淋浴浴帘展开（非玻璃）</label>
<label><input id="wet-door-closed" type="checkbox"> 关闭内区不透明移门</label><p><a href="?view=bath&bathLayout=corner&v=corner-59">当前59版</a> · <a href="?view=bathTop&bathLayout=separate&v=corner-59">58版（窄角已否决）</a> · <a href="?view=bath&bathLayout=hotel&v=corner-59">57版</a> · <a href="?view=bath&bathLayout=original&v=corner-59">56版</a></p>
<label><input id="routes" type="checkbox"> 去卫生间的60cm通路包络</label><label>主卧原门<input id="door" type="range" min="0" max="90" value="90"></label><label>主卫原内开门<input id="bath-angle" type="range" min="0" max="90" value="90"></label>
<h2>窗帘与设备</h2><label><input id="pipe-show" type="checkbox"> 候选穿管路线及安装余量</label><label><input id="cloth-closed" type="checkbox"> 布帘合上（轨道试移至飘窗内）</label><label><input id="sheer-closed" type="checkbox"> 内侧纱帘合上</label><label>幕布<select id="screen-mode"><option value="up">收起</option><option value="down">放下（先锁定柜门）</option></select></label><label><input id="cabinet-light" type="checkbox" checked> 柜前线性灯</label><label>灯光<select id="light-scene"><option value="day">日间</option><option value="evening">暖光</option></select></label><label><input id="labels" type="checkbox"> 尺寸标签</label><label>墙体透明度<input id="opacity" type="range" min="0" max="100" value="100"></label><p><a href="master-suite-plumbing-study.html?view=footwall&v=closed-taper-52">对比保留的上一版</a></p></aside>
