<text x="25" y="448">W03　厨房窗</text><text x="275" y="448">900 / 1200</text><text x="475" y="448">按原图竖向标注修正；横向尚未全校准</text>
<text x="25" y="471">W04　阳台三面玻璃边界</text><text x="275" y="471">200 / 2200</text><text x="475" y="471">保留用户大玻璃方案；高度待复尺</text>
<text x="25" y="494">W05　主卫窗</text><text x="275" y="494">900 / 1200</text><text x="475" y="494">按原图竖向标注修正；横向尚未全校准</text>
