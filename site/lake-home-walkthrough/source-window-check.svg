<text x="25" y="580">LD 按离地高度、CH 按窗高解读；不是承重、窗台板厚或可拆除依据。</text>
<text x="25" y="600">原图三卧 550 / 1700；厨房与两卫 900 / 1200。阳台改造须核验护栏、防坠、抗风和物业条件。</text>
<text x="25" y="622">本图只核对窗区及高度，不是全屋几何、面积、开启扇、玻璃规格或施工验收。</text></g></svg>