<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1132" viewBox="0 0 1600 1132" role="img" aria-label="02 / 衣帽区综合柜＋梳妆台"><rect width="1600" height="1132" fill="#fbfaf6"/><g font-family="Microsoft YaHei, sans-serif"><text x="48" y="62" font-size="32" fill="#373731">02 / 衣帽区综合柜＋梳妆台</text><text x="48" y="98" font-size="17" fill="#726e63">立面展开示意：入口端 → 主卫端；总长2500＝综合柜1500＋梳妆台1000。柜高随实际净高收口。</text><line x1="48" y1="120" x2="1552" y2="120" stroke="#b2ad9f" /><text x="48" y="1100" font-size="16" fill="#373731">主卧套间 / 54版 · 设计标注，不是施工放线图；未改原门窗墙线；数值按状态使用。</text><text x="1470" y="1100" font-size="25" fill="#373731">02</text><rect x="95" y="210" width="375" height="625" rx="0" fill="#e8e5dd" stroke="#a6a396"/><rect x="470" y="647.5" width="250" height="18" rx="0" fill="#c6baaa" stroke="#a6a396"/><line x1="220" y1="835" x2="220" y2="210" stroke="#a49e91" stroke-width="2"/><line x1="345" y1="835" x2="345" y2="210" stroke="#a49e91" stroke-width="2"/><line x1="95" y1="322.5" x2="470" y2="322.5" stroke="#b2ad9f" /><text x="106.25" y="262.5" font-size="19" fill="#373731">顶区：换季轻物／备用品</text><rect x="110" y="692.5" width="95" height="122" rx="3" fill="#8e938a" stroke="#a6a396"/><text x="118.75" y="748.75" font-size="19" fill="#fff">保险箱</text><text x="117.5" y="776.25" font-size="14" fill="#fff">待选型</text><text x="102.5" y="655" font-size="13" fill="#373731">落地承托，非悬空层板</text><line x1="99.5" y1="635" x2="215" y2="635" stroke="#b2ad9f" /><line x1="99.5" y1="522.5" x2="215" y2="522.5" stroke="#b2ad9f" /><line x1="99.5" y1="410" x2="215" y2="410" stroke="#b2ad9f" /><text x="113.75" y="465" font-size="19" fill="#373731">工具盒</text><text x="106.25" y="577.5" font-size="17" fill="#373731">独立分类箱</text><line x1="232.5" y1="360" x2="332.5" y2="360" stroke="#7a8072" stroke-width="3"/><text x="237.5" y="437.5" font-size="18" fill="#373731">日常短衣</text><text x="236.25" y="547.5" font-size="18" fill="#373731">可调层板</text><line x1="346.25" y1="647.5" x2="468.75" y2="647.5" stroke="#938d7f" stroke-width="2"/><line x1="346.25" y1="597.5" x2="468.75" y2="597.5" stroke="#938d7f" stroke-width="2"/><line x1="346.25" y1="547.5" x2="468.75" y2="547.5" stroke="#938d7f" stroke-width="2"/><line x1="346.25" y1="497.5" x2="468.75" y2="497.5" stroke="#938d7f" stroke-width="2"/><text x="355" y="432.5" font-size="15" fill="#373731">干毛巾／纸巾</text><text x="355" y="477.5" font-size="15" fill="#373731">洗护备用品</text><text x="360" y="515" font-size="16" fill="#373731">外抽屉</text><text x="360" y="565" font-size="16" fill="#373731">外抽屉</text><text x="360" y="615" font-size="16" fill="#373731">外抽屉</text><text x="357.5" y="715" font-size="16" fill="#373731">独立备用格</text><rect x="485" y="385" width="162.5" height="212.5" rx="25" fill="#c9d5d2" stroke="#a6a396"/><text x="506.25" y="487.5" font-size="17" fill="#373731">镜后浅收纳</text><line x1="477.5" y1="582.5" x2="477.5" y2="402.5" stroke="#d5b578" stroke-width="5"/><line x1="652.5" y1="582.5" x2="652.5" y2="402.5" stroke="#d5b578" stroke-width="5"/><line x1="657.5" y1="585" x2="707.5" y2="585" stroke="#9b9285" stroke-width="4"/><line x1="657.5" y1="510" x2="707.5" y2="510" stroke="#9b9285" stroke-width="4"/><line x1="657.5" y1="435" x2="707.5" y2="435" stroke="#9b9285" stroke-width="4"/><text x="660" y="462.5" font-size="14" fill="#373731">摆件</text><text x="660" y="550" font-size="14" fill="#373731">护肤</text><rect x="470" y="655" width="122" height="16" rx="0" fill="#ece8de" stroke="#a6a396"/><rect x="595" y="655" width="125" height="16" rx="0" fill="#ece8de" stroke="#a6a396"/><rect x="537.5" y="720" width="100" height="115" rx="18" fill="#c7bcac" stroke="#a6a396"/><text x="545" y="772.5" font-size="18" fill="#373731">收凳</text><line x1="472.5" y1="673" x2="717.5" y2="673" stroke="#a66b47" stroke-dasharray="5 4"/><text x="490" y="687.5" font-size="13" fill="#373731">桌下净高约648，待五金复核</text><line x1="95" y1="880" x2="470" y2="880" stroke="#b2ad9f" /><line x1="470" y1="880" x2="720" y2="880" stroke="#b2ad9f" /><text x="220" y="910" font-size="18" fill="#373731">1500 / 深650</text><text x="530" y="910" font-size="18" fill="#373731">1000 / 深450</text><text x="60" y="965" font-size="22" fill="#373731">立面说明</text><text x="60" y="997" font-size="17" fill="#68675d">此图剖开显示分区，不表示日常柜门全部打开。门面暖白统一，抽屉不整块跳色。</text><text x="60" y="1025" font-size="17" fill="#68675d">3格各500为名义模数；扣板厚后每格净宽不足500。保险箱与工具箱先选型再定格口。</text><text x="820" y="190" font-size="22" fill="#373731">A / 综合柜：不是第二套纯衣柜</text><text x="820" y="222" font-size="17" fill="#68675d">入口端500：保险箱落地格＋上部工具分类箱。</text><text x="820" y="250" font-size="17" fill="#68675d">中间500：日常短挂／叠放；大部分衣物仍在床尾柜。</text><text x="820" y="278" font-size="17" fill="#68675d">主卫端500：干毛巾、纸品、洗护备用；与工具隔开。</text><text x="820" y="306" font-size="17" fill="#68675d">主卫端三层外抽：750—1350范围，单层名义高200。</text><text x="820" y="334" font-size="17" fill="#68675d">顶区从参考2050以上安排轻物，高度随净高调整。</text><text x="820" y="405" font-size="22" fill="#373731">B / 梳妆台：台面、镜柜、抽屉一体</text><text x="820" y="437" font-size="17" fill="#68675d">台面1000×450，高750；台下两浅抽，各约500宽。</text><text x="820" y="465" font-size="17" fill="#68675d">主镜650×850，底950、顶1800；镜后浅柜深120—150。</text><text x="820" y="493" font-size="17" fill="#68675d">侧边开放格约200宽；层间净高250—300，余量作收边。</text><text x="820" y="521" font-size="17" fill="#68675d">镜R100；台面前角R40；650到450深度差保留200。</text><text x="820" y="549" font-size="17" fill="#68675d">转角用侧板和台面同色衔接，不挖大展示洞。</text><text x="820" y="615" font-size="22" fill="#373731">C / 保险箱与卫生收纳的底线</text><text x="820" y="647" font-size="17" fill="#68675d">保险箱重量未知：不假定柜板承载，不把楼板承载当已验收。</text><text x="820" y="675" font-size="17" fill="#68675d">固定方式按保险箱说明及结构条件；不得随意钻结构板。</text><text x="820" y="703" font-size="17" fill="#68675d">外柜门、箱门、工具盒应能分别打开／取出。</text><text x="820" y="731" font-size="17" fill="#68675d">湿毛巾和未干物品留在卫浴通风处，不塞密闭柜。</text><text x="820" y="759" font-size="17" fill="#68675d">吹风机冷却后再收；工具柜不存易燃液体与散装电池。</text><text x="820" y="850" font-size="22" fill="#373731">D / 柜门与通行</text><text x="820" y="882" font-size="17" fill="#68675d">衣帽柜优先3扇约500名义宽平开门，实际扣缝及封边。</text><text x="820" y="910" font-size="17" fill="#68675d">外抽这一格采用上门＋三抽＋下门；不开门也能取小物。</text><text x="820" y="938" font-size="17" fill="#68675d">柜门／镜门方向按五金和主卫通路核对，不保证全开可通行。</text><text x="820" y="966" font-size="17" fill="#68675d">总柜高标H待定，不照搬旧模型2600净高下单。</text></g></svg>