<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1132" viewBox="0 0 1600 1132" role="img" aria-label="04 / 电源与智能设备定位"><rect width="1600" height="1132" fill="#fbfaf6"/><g font-family="Microsoft YaHei, sans-serif"><text x="48" y="62" font-size="32" fill="#373731">04 / 电源与智能设备定位</text><text x="48" y="98" font-size="17" fill="#726e63">只标功能点，不画未经核定的电线、冷媒管、排水管或结构孔位；旧版床尾梳妆／空调电源不再沿用。</text><line x1="48" y1="120" x2="1552" y2="120" stroke="#b2ad9f" /><text x="48" y="1100" font-size="16" fill="#373731">主卧套间 / 54版 · 设计标注，不是施工放线图；未改原门窗墙线；数值按状态使用。</text><text x="1470" y="1100" font-size="25" fill="#373731">04</text><polygon points="307.2,195 652.8,195 652.8,562.2 264,562.2 264,702.6 75,702.6 75,416.4 307.2,416.4" fill="#eeece3" stroke="#9c9e93"/><polygon points="75,195 307.2,195 307.2,416.4 75,416.4" fill="#eeece3" stroke="#9c9e93"/><polygon points="75,702.6 264,702.6 264,772.8 75,772.8" fill="#eeece3" stroke="#9c9e93"/><polygon points="609.6,195 609.6,130.2 717.6,130.2 717.6,443.4 652.8,443.4 652.8,195" fill="#dfe9e6" stroke="#9c9e93"/><line x1="75" y1="195" x2="307.2" y2="195" stroke="#91978c" stroke-width="10.8"/><line x1="75" y1="195" x2="75" y2="416.4" stroke="#91978c" stroke-width="10.8"/><line x1="307.2" y1="195" x2="609.6" y2="195" stroke="#91978c" stroke-width="21.6"/><line x1="307.2" y1="195" x2="307.2" y2="416.4" stroke="#91978c" stroke-width="10.8"/><line x1="75" y1="416.4" x2="307.2" y2="416.4" stroke="#91978c" stroke-width="10.8"/><line x1="75" y1="416.4" x2="75" y2="702.6" stroke="#91978c" stroke-width="10.8"/><line x1="75" y1="702.6" x2="264" y2="702.6" stroke="#91978c" stroke-width="10.8"/><line x1="264" y1="562.2" x2="264" y2="702.6" stroke="#91978c" stroke-width="10.8"/><line x1="264" y1="562.2" x2="652.8" y2="562.2" stroke="#91978c" stroke-width="21.6"/><line x1="652.8" y1="443.4" x2="652.8" y2="562.2" stroke="#91978c" stroke-width="21.6"/><line x1="609.6" y1="130.2" x2="609.6" y2="195" stroke="#91978c" stroke-width="10.8"/><line x1="609.6" y1="130.2" x2="717.6" y2="130.2" stroke="#91978c" stroke-width="10.8"/><line x1="717.6" y1="130.2" x2="717.6" y2="443.4" stroke="#91978c" stroke-width="10.8"/><line x1="652.8" y1="443.4" x2="717.6" y2="443.4" stroke="#91978c" stroke-width="10.8"/><line x1="112.8" y1="195" x2="177.6" y2="195" stroke="#94afb0" stroke-width="5"/><line x1="161.4" y1="702.6" x2="258.6" y2="702.6" stroke="#fbfaf6" stroke-width="14"/><line x1="258.6" y1="702.6" x2="258.59999999999997" y2="605.4000000000001" stroke="#a48463" stroke-width="3"/><path d="M161.39999999999998,702.6 A97.2,97.2 0 0 1 258.59999999999997,605.4000000000001" fill="none" stroke="#a48463" stroke-dasharray="4 4"/><line x1="193.8" y1="416.4" x2="285.6" y2="416.4" stroke="#fbfaf6" stroke-width="14"/><line x1="285.6" y1="416.4" x2="285.59999999999997" y2="324.59999999999997" stroke="#a48463" stroke-width="3"/><path d="M193.8,416.4 A91.8,91.8 0 0 1 285.59999999999997,324.59999999999997" fill="none" stroke="#a48463" stroke-dasharray="4 4"/><line x1="717.6" y1="130.2" x2="717.6" y2="443.4" stroke="#94afb0" stroke-width="5"/><line x1="609.6" y1="130.2" x2="717.6" y2="130.2" stroke="#94afb0" stroke-width="5"/><rect x="372" y="200.4" width="203.04" height="215.99999999999997" rx="0" fill="#cfc2b0" stroke="#a6a396"/><rect x="77.16" y="531.96" width="70.2" height="162" rx="0" fill="#dadccc" stroke="#a6a396"/><rect x="77.16" y="423.96000000000004" width="48.599999999999994" height="108" rx="0" fill="#dadccc" stroke="#a6a396"/><rect x="285.6" y="494.052" width="367.19999999999993" height="64.80000000000001" rx="0" fill="#dadccc" stroke="#a6a396"/><text x="404.4" y="340.8" font-size="15" fill="#373731">床垫1800×1900</text><text x="355.8" y="535.2" font-size="14" fill="#373731">整柜3400＋圆弧收口150</text><text x="83.64" y="519" font-size="13" fill="#373731">梳妆</text><text x="83.64" y="648.6" font-size="13" fill="#373731">综合柜</text><text x="118.2" y="270.6" font-size="16" fill="#373731">主卫</text><text x="377.4" y="465" font-size="14" fill="#373731">柜前净距参考719</text><rect x="189.48000000000002" y="443.4" width="64.8" height="221.39999999999998" rx="0" fill="#d5e4d0" stroke="#a6a396"/><text x="194.88" y="519" font-size="13" fill="#373731">通行</text><circle cx="81.48" cy="513.6" r="6" fill="#477677"/><text x="91.48" y="505.6" font-size="14" fill="#477677">P01</text><circle cx="350.4" cy="202.56" r="6" fill="#477677"/><text x="360.4" y="194.56" font-size="14" fill="#477677">P02</text><circle cx="604.2" cy="202.56" r="6" fill="#477677"/><text x="614.2" y="194.56" font-size="14" fill="#477677">P03</text><circle cx="260.76" cy="594.6" r="6" fill="#477677"/><text x="270.76" y="586.6" font-size="14" fill="#477677">P04</text><circle cx="642" cy="394.8" r="6" fill="#477677"/><text x="652" y="386.8" font-size="14" fill="#477677">AC01</text><circle cx="669" cy="170.16" r="6" fill="#477677"/><text x="679" y="162.16" font-size="14" fill="#477677">C01</text><circle cx="708.96" cy="153.96" r="6" fill="#477677"/><text x="718.96" y="145.96" font-size="14" fill="#477677">C02</text><circle cx="423.3" cy="240.36" r="6" fill="#477677"/><text x="433.3" y="232.36" font-size="14" fill="#477677">PJ01</text><circle cx="531.84" cy="480.12" r="6" fill="#477677"/><text x="541.84" y="472.12" font-size="14" fill="#477677">SC01</text><text x="60" y="875" font-size="22" fill="#373731">点位与安装状态</text><text x="60" y="907" font-size="17" fill="#68675d">此图标点表示功能位置，不表示插座一定装在点的中心。</text><text x="60" y="935" font-size="17" fill="#68675d">空调位由用户选定；高度、背板孔位、管线与排水待核。</text><text x="60" y="963" font-size="17" fill="#68675d">布帘／纱帘电机在飘窗内；轨道端部留可拆检修。</text><rect x="800" y="150" width="730" height="44" rx="0" fill="#fbfaf6" stroke="#a6a396"/><text x="810" y="175" font-size="16" fill="#373731">编号 / 功能</text><text x="1250" y="175" font-size="16" fill="#373731">高度状态</text><rect x="800" y="194" width="730" height="44" rx="0" fill="#f3f0e9" stroke="#a6a396"/><text x="810" y="219" font-size="16" fill="#373731">P01 梳妆台电源</text><text x="1250" y="219" font-size="16" fill="#373731">中心950暂排</text><rect x="800" y="238" width="730" height="44" rx="0" fill="#fbfaf6" stroke="#a6a396"/><text x="810" y="263" font-size="16" fill="#373731">P02 床左电源</text><text x="1250" y="263" font-size="16" fill="#373731">中心650暂排</text><rect x="800" y="282" width="730" height="44" rx="0" fill="#f3f0e9" stroke="#a6a396"/><text x="810" y="307" font-size="16" fill="#373731">P03 床右电源</text><text x="1250" y="307" font-size="16" fill="#373731">中心650暂排</text><rect x="800" y="326" width="730" height="44" rx="0" fill="#fbfaf6" stroke="#a6a396"/><text x="810" y="351" font-size="16" fill="#373731">P04 衣帽区备用电源</text><text x="1250" y="351" font-size="16" fill="#373731">中心300暂排</text><rect x="800" y="370" width="730" height="44" rx="0" fill="#f3f0e9" stroke="#a6a396"/><text x="810" y="395" font-size="16" fill="#373731">AC01 窗上靠右空调</text><text x="1250" y="395" font-size="16" fill="#373731">安装高度待实测</text><rect x="800" y="414" width="730" height="44" rx="0" fill="#fbfaf6" stroke="#a6a396"/><text x="810" y="439" font-size="16" fill="#373731">C01 飘窗内部布帘电机</text><text x="1250" y="439" font-size="16" fill="#373731">随轨道／电机</text><rect x="800" y="458" width="730" height="44" rx="0" fill="#f3f0e9" stroke="#a6a396"/><text x="810" y="483" font-size="16" fill="#373731">C02 飘窗内部纱帘电机</text><text x="1250" y="483" font-size="16" fill="#373731">随轨道／电机</text><rect x="800" y="502" width="730" height="44" rx="0" fill="#fbfaf6" stroke="#a6a396"/><text x="810" y="527" font-size="16" fill="#373731">PJ01 投影机吊装</text><text x="1250" y="527" font-size="16" fill="#373731">随净高／机型</text><rect x="800" y="546" width="730" height="44" rx="0" fill="#f3f0e9" stroke="#a6a396"/><text x="810" y="571" font-size="16" fill="#373731">SC01 电动幕布</text><text x="1250" y="571" font-size="16" fill="#373731">幕盒端部待定</text><text x="810" y="700" font-size="22" fill="#373731">供电与操作</text><text x="810" y="732" font-size="17" fill="#68675d">空调、幕布、窗帘、投影各按机型留常电及本地控制。</text><text x="810" y="760" font-size="17" fill="#68675d">禁止用普通灯光调光器调节电机；不靠断总电源操控。</text><text x="810" y="788" font-size="17" fill="#68675d">吹风机在梳妆位使用，冷却后入柜；不留抽屉内常通电。</text><text x="810" y="816" font-size="17" fill="#68675d">床边插座与控制面板错开，避免活动柜、软包挡住。</text><text x="810" y="900" font-size="22" fill="#373731">未验证范围</text><text x="810" y="932" font-size="17" fill="#68675d">湿区安全距离、插座防护、线路负载与接地未验收。</text><text x="810" y="960" font-size="17" fill="#68675d">有线／无线协议未选；图中场景尚未部署到真实设备。</text><text x="810" y="988" font-size="17" fill="#68675d">保险箱不默认需要插电，待具体型号再决定是否预留。</text></g></svg>