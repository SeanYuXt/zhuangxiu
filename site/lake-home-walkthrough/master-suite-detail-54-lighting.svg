<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1132" viewBox="0 0 1600 1132" role="img" aria-label="01 / 灯光与开关定位"><rect width="1600" height="1132" fill="#fbfaf6"/><g font-family="Microsoft YaHei, sans-serif"><text x="48" y="62" font-size="32" fill="#373731">01 / 灯光与开关定位</text><text x="48" y="98" font-size="17" fill="#726e63">灯光点位为方案位置；所有标高相对完成地面。顶部设备标高不沿用暂定2600作为施工值。</text><line x1="48" y1="120" x2="1552" y2="120" stroke="#b2ad9f" /><text x="48" y="1100" font-size="16" fill="#373731">主卧套间 / 54版 · 设计标注，不是施工放线图；未改原门窗墙线；数值按状态使用。</text><text x="1470" y="1100" font-size="25" fill="#373731">01</text><polygon points="307.2,195 652.8,195 652.8,562.2 264,562.2 264,702.6 75,702.6 75,416.4 307.2,416.4" fill="#eeece3" stroke="#9c9e93"/><polygon points="75,195 307.2,195 307.2,416.4 75,416.4" fill="#eeece3" stroke="#9c9e93"/><polygon points="75,702.6 264,702.6 264,772.8 75,772.8" fill="#eeece3" stroke="#9c9e93"/><polygon points="609.6,195 609.6,130.2 717.6,130.2 717.6,443.4 652.8,443.4 652.8,195" fill="#dfe9e6" stroke="#9c9e93"/><line x1="75" y1="195" x2="307.2" y2="195" stroke="#91978c" stroke-width="10.8"/><line x1="75" y1="195" x2="75" y2="416.4" stroke="#91978c" stroke-width="10.8"/><line x1="307.2" y1="195" x2="609.6" y2="195" stroke="#91978c" stroke-width="21.6"/><line x1="307.2" y1="195" x2="307.2" y2="416.4" stroke="#91978c" stroke-width="10.8"/><line x1="75" y1="416.4" x2="307.2" y2="416.4" stroke="#91978c" stroke-width="10.8"/><line x1="75" y1="416.4" x2="75" y2="702.6" stroke="#91978c" stroke-width="10.8"/><line x1="75" y1="702.6" x2="264" y2="702.6" stroke="#91978c" stroke-width="10.8"/><line x1="264" y1="562.2" x2="264" y2="702.6" stroke="#91978c" stroke-width="10.8"/><line x1="264" y1="562.2" x2="652.8" y2="562.2" stroke="#91978c" stroke-width="21.6"/><line x1="652.8" y1="443.4" x2="652.8" y2="562.2" stroke="#91978c" stroke-width="21.6"/><line x1="609.6" y1="130.2" x2="609.6" y2="195" stroke="#91978c" stroke-width="10.8"/><line x1="609.6" y1="130.2" x2="717.6" y2="130.2" stroke="#91978c" stroke-width="10.8"/><line x1="717.6" y1="130.2" x2="717.6" y2="443.4" stroke="#91978c" stroke-width="10.8"/><line x1="652.8" y1="443.4" x2="717.6" y2="443.4" stroke="#91978c" stroke-width="10.8"/><line x1="112.8" y1="195" x2="177.6" y2="195" stroke="#94afb0" stroke-width="5"/><line x1="161.4" y1="702.6" x2="258.6" y2="702.6" stroke="#fbfaf6" stroke-width="14"/><line x1="258.6" y1="702.6" x2="258.59999999999997" y2="605.4000000000001" stroke="#a48463" stroke-width="3"/><path d="M161.39999999999998,702.6 A97.2,97.2 0 0 1 258.59999999999997,605.4000000000001" fill="none" stroke="#a48463" stroke-dasharray="4 4"/><line x1="193.8" y1="416.4" x2="285.6" y2="416.4" stroke="#fbfaf6" stroke-width="14"/><line x1="285.6" y1="416.4" x2="285.59999999999997" y2="324.59999999999997" stroke="#a48463" stroke-width="3"/><path d="M193.8,416.4 A91.8,91.8 0 0 1 285.59999999999997,324.59999999999997" fill="none" stroke="#a48463" stroke-dasharray="4 4"/><line x1="717.6" y1="130.2" x2="717.6" y2="443.4" stroke="#94afb0" stroke-width="5"/><line x1="609.6" y1="130.2" x2="717.6" y2="130.2" stroke="#94afb0" stroke-width="5"/><rect x="372" y="200.4" width="203.04" height="215.99999999999997" rx="0" fill="#cfc2b0" stroke="#a6a396"/><rect x="77.16" y="531.96" width="70.2" height="162" rx="0" fill="#dadccc" stroke="#a6a396"/><rect x="77.16" y="423.96000000000004" width="48.599999999999994" height="108" rx="0" fill="#dadccc" stroke="#a6a396"/><rect x="285.6" y="494.052" width="367.19999999999993" height="64.80000000000001" rx="0" fill="#dadccc" stroke="#a6a396"/><text x="404.4" y="340.8" font-size="15" fill="#373731">床垫1800×1900</text><text x="355.8" y="535.2" font-size="14" fill="#373731">整柜3400＋圆弧收口150</text><text x="83.64" y="519" font-size="13" fill="#373731">梳妆</text><text x="83.64" y="648.6" font-size="13" fill="#373731">综合柜</text><text x="118.2" y="270.6" font-size="16" fill="#373731">主卫</text><text x="377.4" y="465" font-size="14" fill="#373731">柜前净距参考719</text><rect x="189.48000000000002" y="443.4" width="64.8" height="221.39999999999998" rx="0" fill="#d5e4d0" stroke="#a6a396"/><text x="194.88" y="519" font-size="13" fill="#373731">通行</text><circle cx="480" cy="373.2" r="6" fill="#b47a3c"/><text x="490" y="365.2" font-size="14" fill="#b47a3c">L01</text><circle cx="458.4" cy="199.32" r="6" fill="#b47a3c"/><text x="468.4" y="187.32" font-size="14" fill="#b47a3c">L02</text><circle cx="193.8" cy="567.6" r="6" fill="#b47a3c"/><text x="203.8" y="559.6" font-size="14" fill="#b47a3c">L03</text><circle cx="87.96" cy="477.96000000000004" r="6" fill="#b47a3c"/><text x="97.96" y="469.96000000000004" font-size="14" fill="#b47a3c">L04</text><circle cx="123.6" cy="594.6" r="6" fill="#b47a3c"/><text x="133.6" y="586.6" font-size="14" fill="#b47a3c">L05</text><circle cx="485.4" cy="458.52" r="6" fill="#b47a3c"/><text x="495.4" y="450.52" font-size="14" fill="#b47a3c">L06</text><circle cx="674.4" cy="429.36" r="6" fill="#b47a3c"/><text x="617.4" y="419.36" font-size="14" fill="#b47a3c">L07</text><circle cx="237" cy="305.15999999999997" r="6" fill="#b47a3c"/><text x="247" y="297.15999999999997" font-size="14" fill="#b47a3c">L08</text><circle cx="244.56" cy="207.96" r="6" fill="#b47a3c"/><text x="254.56" y="199.96" font-size="14" fill="#b47a3c">L09</text><circle cx="442.2" cy="513.6" r="6" fill="#b47a3c"/><text x="452.2" y="505.6" font-size="14" fill="#b47a3c">L05</text><circle cx="141.95999999999998" cy="714.4799999999999" r="6" fill="#477677"/><text x="151.95999999999998" y="706.4799999999999" font-size="14" fill="#477677">S01</text><circle cx="177.6" cy="418.02" r="6" fill="#477677"/><text x="187.6" y="410.02" font-size="14" fill="#477677">S02</text><circle cx="340.68" cy="202.02" r="6" fill="#477677"/><text x="350.68" y="194.02" font-size="14" fill="#477677">S03</text><circle cx="591.24" cy="202.02" r="6" fill="#477677"/><text x="601.24" y="194.02" font-size="14" fill="#477677">S04</text><circle cx="81.48" cy="434.76" r="6" fill="#477677"/><text x="91.48" y="426.76" font-size="14" fill="#477677">S05</text><circle cx="676.5600000000001" cy="435.84000000000003" r="6" fill="#477677"/><text x="686.5600000000001" y="462.84000000000003" font-size="14" fill="#477677">S06</text><text x="60" y="820" font-size="16" fill="#373731">橙色 L＝灯具　青色 S＝开关　图上方向沿原图，地理北待核</text><text x="60" y="875" font-size="22" fill="#373731">使用边界</text><text x="60" y="907" font-size="17" fill="#68675d">绿色只表示原方案60cm通行试排带，不是人体工学验收。</text><text x="60" y="935" font-size="17" fill="#68675d">主卫门向内开；坐凳拉出、柜门开启后仍须实物检查。</text><text x="60" y="963" font-size="17" fill="#68675d">柜前719mm是关门状态；平开门后局部约298mm，不作通道。</text><rect x="800" y="150" width="730" height="44" rx="0" fill="#fbfaf6" stroke="#a6a396"/><text x="810" y="175" font-size="16" fill="#373731">编号 / 灯具</text><text x="1170" y="175" font-size="16" fill="#373731">色温与控制</text><rect x="800" y="194" width="730" height="44" rx="0" fill="#f3f0e9" stroke="#a6a396"/><text x="810" y="219" font-size="16" fill="#373731">L01 卧室吸顶主灯</text><text x="1170" y="219" font-size="16" fill="#373731">3000K / Ra≥90</text><rect x="800" y="238" width="730" height="44" rx="0" fill="#fbfaf6" stroke="#a6a396"/><text x="810" y="263" font-size="16" fill="#373731">L02 床头半墙灯带</text><text x="1170" y="263" font-size="16" fill="#373731">3000K / 低压型材</text><rect x="800" y="282" width="730" height="44" rx="0" fill="#f3f0e9" stroke="#a6a396"/><text x="810" y="307" font-size="16" fill="#373731">L03 衣帽区柔光吸顶灯</text><text x="1170" y="307" font-size="16" fill="#373731">3000K / Ra≥90</text><rect x="800" y="326" width="730" height="44" rx="0" fill="#fbfaf6" stroke="#a6a396"/><text x="810" y="351" font-size="16" fill="#373731">L04 梳妆镜双侧面光</text><text x="1170" y="351" font-size="16" fill="#373731">3500—4000K / Ra≥95</text><rect x="800" y="370" width="730" height="44" rx="0" fill="#f3f0e9" stroke="#a6a396"/><text x="810" y="395" font-size="16" fill="#373731">L05 综合柜／床尾柜内灯</text><text x="1170" y="395" font-size="16" fill="#373731">3000K / 低压型材</text><rect x="800" y="414" width="730" height="44" rx="0" fill="#fbfaf6" stroke="#a6a396"/><text x="810" y="439" font-size="16" fill="#373731">L06 柜前线性照明</text><text x="1170" y="439" font-size="16" fill="#373731">3000K / 防眩</text><rect x="800" y="458" width="730" height="44" rx="0" fill="#f3f0e9" stroke="#a6a396"/><text x="810" y="483" font-size="16" fill="#373731">L07 飘窗书柜阅读灯</text><text x="1170" y="483" font-size="16" fill="#373731">3000K / 遮光灯罩</text><rect x="800" y="502" width="730" height="44" rx="0" fill="#fbfaf6" stroke="#a6a396"/><text x="810" y="527" font-size="16" fill="#373731">L08 主卫主灯／风暖一体</text><text x="1170" y="527" font-size="16" fill="#373731">主灯3500—4000K</text><rect x="800" y="546" width="730" height="44" rx="0" fill="#f3f0e9" stroke="#a6a396"/><text x="810" y="571" font-size="16" fill="#373731">L09 主卫镜前柔光</text><text x="1170" y="571" font-size="16" fill="#373731">3500—4000K / Ra≥90</text><text x="810" y="660" font-size="22" fill="#373731">灯光层次，不把灯带当主灯</text><text x="810" y="692" font-size="17" fill="#68675d">主灯负责均匀照明；镜侧灯负责面部，不只照墙。</text><text x="810" y="720" font-size="17" fill="#68675d">床头1100高半墙上沿线性灯独立调光，前沿下垂10mm。</text><text x="810" y="748" font-size="17" fill="#68675d">柜内灯随门开启；取消旧“独立转角展示格灯”。</text><text x="810" y="776" font-size="17" fill="#68675d">主卫灯具、风暖按防潮分区选型，不在图上猜IP等级。</text><text x="810" y="850" font-size="22" fill="#373731">开关高度与控制原则</text><text x="810" y="882" font-size="17" fill="#68675d">S01门外1150；S02主卫门外1200；S03/04床侧700。</text><text x="810" y="910" font-size="17" fill="#68675d">S05梳妆侧950；S06阅读位1200。均为中心高度暂排。</text><text x="810" y="938" font-size="17" fill="#68675d">保留实体按键与离线基础控制；联网场景不是唯一控制。</text><text x="810" y="966" font-size="17" fill="#68675d">每一路的正式回路、线径、保护及接地由电工深化。</text></g></svg>