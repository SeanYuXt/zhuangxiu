<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1132" viewBox="0 0 1600 1132" role="img" aria-label="03 / 圆角、收口与设备联动"><rect width="1600" height="1132" fill="#fbfaf6"/><g font-family="Microsoft YaHei, sans-serif"><text x="48" y="62" font-size="32" fill="#373731">03 / 圆角、收口与设备联动</text><text x="48" y="98" font-size="17" fill="#726e63">R表示圆角半径；所有新圆角／收口是设计建议，须用材料样板、五金与现场尺寸确认。单位mm。</text><line x1="48" y1="120" x2="1552" y2="120" stroke="#b2ad9f" /><text x="48" y="1100" font-size="16" fill="#373731">主卧套间 / 54版 · 设计标注，不是施工放线图；未改原门窗墙线；数值按状态使用。</text><text x="1470" y="1100" font-size="25" fill="#373731">03</text><rect x="48" y="145" width="1495" height="47" rx="0" fill="#fbfaf6" stroke="#a6a396"/><text x="58" y="170" font-size="17" fill="#373731">编号</text><text x="138" y="170" font-size="17" fill="#373731">部位</text><text x="383" y="170" font-size="17" fill="#373731">尺寸 / 形式</text><text x="713" y="170" font-size="17" fill="#373731">施工边界</text><rect x="48" y="192" width="1495" height="47" rx="0" fill="#f3f0e9" stroke="#a6a396"/><text x="58" y="217" font-size="17" fill="#373731">R01</text><text x="138" y="217" font-size="17" fill="#373731">床尾整柜入卧端</text><text x="383" y="217" font-size="17" fill="#373731">平面外圆角 R150</text><text x="713" y="217" font-size="17" fill="#373731">沿用15cm实体收口，不新增展示洞；不计收纳</text><rect x="48" y="239" width="1495" height="47" rx="0" fill="#fbfaf6" stroke="#a6a396"/><text x="58" y="264" font-size="17" fill="#373731">R02</text><text x="138" y="264" font-size="17" fill="#373731">梳妆台暴露前角</text><text x="383" y="264" font-size="17" fill="#373731">平面 R40；触摸边 R2—3</text><text x="713" y="264" font-size="17" fill="#373731">桌面1000×450；圆角包含在外包尺寸内</text><rect x="48" y="286" width="1495" height="47" rx="0" fill="#f3f0e9" stroke="#a6a396"/><text x="58" y="311" font-size="17" fill="#373731">R03</text><text x="138" y="311" font-size="17" fill="#373731">柜深650转桌深450</text><text x="383" y="311" font-size="17" fill="#373731">暴露侧板前棱 R20暂定</text><text x="713" y="311" font-size="17" fill="#373731">柜门与桌板分构件收口；不做难落地的大空洞</text><rect x="48" y="333" width="1495" height="47" rx="0" fill="#fbfaf6" stroke="#a6a396"/><text x="58" y="358" font-size="17" fill="#373731">R04</text><text x="138" y="358" font-size="17" fill="#373731">梳妆镜轮廓</text><text x="383" y="358" font-size="17" fill="#373731">圆角矩形 R100暂定</text><text x="713" y="358" font-size="17" fill="#373731">主镜650×850；右侧200宽浅格，另留收边</text><rect x="48" y="380" width="1495" height="47" rx="0" fill="#f3f0e9" stroke="#a6a396"/><text x="58" y="405" font-size="17" fill="#373731">R05</text><text x="138" y="405" font-size="17" fill="#373731">床头半墙平面前角</text><text x="383" y="405" font-size="17" fill="#373731">R35；触摸边 R2—3</text><text x="713" y="405" font-size="17" fill="#373731">沿用厚40、高1100，不再做20cm厚背景</text><rect x="48" y="427" width="1495" height="47" rx="0" fill="#fbfaf6" stroke="#a6a396"/><text x="58" y="452" font-size="17" fill="#373731">R06</text><text x="138" y="452" font-size="17" fill="#373731">飘窗书柜层板</text><text x="383" y="452" font-size="17" fill="#373731">暴露角 R20；边 R2—3</text><text x="713" y="452" font-size="17" fill="#373731">只放轻物；固定与窗扇／栏杆防护待核</text><rect x="48" y="474" width="1495" height="47" rx="0" fill="#f3f0e9" stroke="#a6a396"/><text x="58" y="499" font-size="17" fill="#373731">R07</text><text x="138" y="499" font-size="17" fill="#373731">卧室单眼皮</text><text x="383" y="499" font-size="17" fill="#373731">暂定下挂80、突出30</text><text x="713" y="499" font-size="17" fill="#373731">不是已确认施工尺寸；窗上空调段暂断开</text><rect x="48" y="521" width="1495" height="47" rx="0" fill="#fbfaf6" stroke="#a6a396"/><text x="58" y="546" font-size="17" fill="#373731">R08</text><text x="138" y="546" font-size="17" fill="#373731">普通柜门／抽屉</text><text x="383" y="546" font-size="17" fill="#373731">边口 R1—2或配套封边</text><text x="713" y="546" font-size="17" fill="#373731">目标缝3mm，按铰链／材料调整；无外露把手</text><text x="65" y="660" font-size="22" fill="#373731">床头半墙剖面（放大示意，不按图量尺）</text><text x="65" y="692" font-size="17" fill="#68675d">完成厚40，完成顶高1100；前沿下垂10遮灯珠。</text><text x="65" y="720" font-size="17" fill="#68675d">灯槽参考高18、深17，型材适配后再定加工尺寸。</text><text x="65" y="748" font-size="17" fill="#68675d">前沿不能仅凭10mm保证不眩光：坐卧位置打样。</text><text x="65" y="776" font-size="17" fill="#68675d">驱动置可检修位，不埋死；型材负责散热。</text><rect x="80" y="850" width="70" height="160" rx="0" fill="#cac2b4" stroke="#a6a396"/><rect x="150" y="850" width="140" height="18" rx="0" fill="#c0b5a2" stroke="#a6a396"/><rect x="270" y="850" width="20" height="50" rx="0" fill="#c0b5a2" stroke="#a6a396"/><line x1="167" y1="879" x2="250" y2="879" stroke="#d0a65e" stroke-width="6"/><text x="320" y="884" font-size="18" fill="#373731">灯带内退，前沿遮光</text><text x="320" y="926" font-size="18" fill="#373731">高1100 / 厚40</text><text x="320" y="968" font-size="16" fill="#373731">下垂10 ≠ 安装灯带外露10</text><text x="820" y="660" font-size="22" fill="#373731">窗上空调＋单眼皮</text><text x="820" y="692" font-size="17" fill="#68675d">空调靠右；95cm仅机长占位，背板和机高按型号。</text><text x="820" y="720" font-size="17" fill="#68675d">用户提出最少480安装空间：由厂家确认测量边界。</text><text x="820" y="748" font-size="17" fill="#68675d">照片比例约53cm未校正透视，不作为放线尺寸。</text><text x="820" y="776" font-size="17" fill="#68675d">单眼皮暂80下挂／30突出；空调所在窗墙暂不连续做。</text><text x="820" y="804" font-size="17" fill="#68675d">必要时下探须核挂板基层、窗扇、帘轨和排水坡度。</text><text x="820" y="875" font-size="22" fill="#373731">窗帘、投影与防护</text><text x="820" y="907" font-size="17" fill="#68675d">布／纱双轨、电机均在飘窗内；无窗帘盒，保留检修。</text><text x="820" y="935" font-size="17" fill="#68675d">幕盒独立可靠固定，不让柜顶板承重；投影机另设支架。</text><text x="820" y="963" font-size="17" fill="#68675d">柜门抽屉收好再落幕；未实装传感器，不宣称自动防撞。</text><text x="820" y="991" font-size="17" fill="#68675d">窗边书柜不得固定到窗框；保留栏杆并核查儿童防坠。</text></g></svg>