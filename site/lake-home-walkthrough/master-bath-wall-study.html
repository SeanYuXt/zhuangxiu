<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主卧试排 · 主卫侧整柜</title><link rel="icon" href="data:,"><link rel="stylesheet" href="master-bath-wall-study.css"></head>
<body><header><div><small>MASTER SUITE / 10 · 布局比较</small><h1>主卫侧整柜，床头转向实墙</h1><p>不改门、不拆飘窗 · 此方案有单侧上下床的代价</p></div><nav><button data-view="whole">透视</button><button data-view="top">俯视</button><button data-view="plan" class="active">尺寸平面</button></nav></header>
<main><aside class="locations"><h2>空间定位</h2><button data-view="whole">查看全部 · 新试排</button><button data-view="entry">入口看床与整柜</button><button data-view="wardrobe">主卫侧 2m 整柜</button><button data-view="window">真实窗前梳妆位</button><button data-view="bed">转向后的床头</button><h2>使用状态</h2><label>原房门开启角度 <input id="door" type="range" min="0" max="90" value="90"></label><label>柜门状态<select id="cabinet"><option value="closed">关闭</option><option value="slide">一扇移门打开</option></select></label><label><input id="pull" type="checkbox"> 梳妆椅后移 45cm</label><label><input id="routes" type="checkbox"> 显示通行带和腿位</label><label><input id="labels" type="checkbox" checked> 显示空间标签</label><label>墙体透明度<input id="opacity" type="range" min="0" max="100" value="70"></label><p>拖动旋转，滚轮缩放。侧墙与顶面为模型剖视；原门窗位置不变。</p><a href="master-suite-study.html?scheme=calm&v=sleep-entry-09&view=plan">返回上版比较</a></aside>
<section id="viewer"><canvas id="scene" hidden aria-label="主卫侧衣柜试排三维模型"></canvas><svg id="plan" viewBox="-25 -85 660 665" aria-label="主卫侧衣柜试排尺寸平面"></svg><div class="orientation">原图方向 · 北向待核</div><div id="caption">尺寸平面 · CAD 恢复坐标，不是现场净尺寸</div></section>
<aside><h2>先看尺寸与代价</h2><dl id="metrics"></dl><div class="warning"><b>这不是双侧舒适布局</b><p>床靠窗一侧仅约 12cm，不能走人。睡在里侧的人要从床尾上下床或跨床；床品整理也会不便。</p></div><h2>本版怎么处理</h2><div id="notes"></div><h2>几何检查</h2><p id="audit">正在核对…</p><p>家具、椅子后移与原门扫掠按模型检查；不等于真人使用、结构锚固或施工验收。</p></aside></main><script type="module" src="master-bath-wall-study.js?v=bath-wall-10"></script></body></html>
