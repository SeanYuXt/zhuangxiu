<text x="8" y="395">左侧原75cm衣柜＋部分化妆区将被洗漱台占用</text><text x="8" y="417">这是空间取舍示意，尚未修改原卧室设计</text></svg><p>分区顺序：开放洗漱 → 单轨隐私门 → 马桶与淋浴；淋浴另有玻璃门。</p><p class="muted">这一方向需要让出原衣柜与部分化妆区，且不是把台盆挤进床旁60cm通道。存疑墙线保留；未做排水、门框、窗扇和完整人体校验，不能作为施工方案。</p></main><script>let a=false,b=false;document.getElementById('entry').onclick=()=>{a=!a;document.getElementById('slide').setAttribute('x',a?25:110)};document.getElementById('shower').onclick=()=>{b=!b;document.getElementById('glass').setAttribute('transform',`translate(205 100) rotate(${b?-90:0})`)};</script></html>
